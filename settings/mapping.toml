# PerfectDarkZeroRecomp - input mapping settings
#
# Loaded automatically at startup in addition to hardware.toml (see
# OnConfigurePaths in src/perfectdarkzerorecomp_app.h.h). --flag on the command line and
# REX_* environment variables always override values from this file.
#
# Gamepad button layouts (DualShock 4 / DualSense / Xbox / Switch Pro, etc.)
# are auto-mapped to the Xbox 360 layout by SDL - there is nothing to
# configure for that here. These three cvars only select/tune the backend.
#
# Flat key = value only

# "" is rejected by this cvar's validator (logs a warning, falls back to
# compiled default) - must be an explicit value: "sdl", "xinput", or "nop"
# (input disabled). "sdl" is what's actually in use, confirmed via the
# startup log line "SDL input driver initialized successfully".
input_backend = "sdl"

# Path to a custom HID remap file used to fill in gamepads SDL doesn't
# already recognize, or "" to skip it. "gamecontrollerdb.txt" matches the
# file CMakeLists.txt stages next to the exe from settings/gamecontrollerdb.txt
# (sourced from https://github.com/mdqinc/SDL_GameControllerDB).
hid_mappings_file = "gamecontrollerdb.txt"

# Route the controller Guide/PS button to the guest.
guide_button = true

# Keyboard+mouse run in parallel with a physical gamepad, not instead of it -
# the SDK always merges every assigned device's input for guest user 0
# (see rex::input::MergeInto). mnk_mode turns on keyboard-as-controller;
# mnk_mouse lets the mouse aim (below) and, where the game's on-foot look
# doesn't run (vehicles, turrets), drive the right stick (mnk_sensitivity).
mnk_mode = true
mnk_mouse = true
mnk_sensitivity = 5.0
right_stick_deadzone_percentage = 0.2

# Mouse aim (src/mod/mouse_look.cpp, docs/MOUSE_KEYBOARD.md): on foot the mouse
# turns the view directly - no stick dead zone, response curve, acceleration
# or turn cap; the game's pitch limit applies, and zoomed aiming is slower in
# proportion to the field of view.
pdz_mouse_look = true
# The view turns 0.022 deg x this per mouse count (the Source games' scale).
pdz_mouse_sensitivity = 2.0
# Up / down inverted.
pdz_mouse_invert = false
# While the keyboard / mouse is the last device used, the game's auto-aim and
# aim assist are off; using a controller brings them back (logged each switch).
pdz_mouse_aim_assist_off = true
# Step zoom (off by default; docs/MOUSE_KEYBOARD.md): holding LT / the aim key
# zooms to the gun's first level, R3 / the mouse wheel steps to the others.
# The settings window's Controls tab adds "pdz_zoom_steps = true" when ticked.

# ─────────────────────────────────────────────────────────────
# Keyboard and mouse bindings (each to the controller input PDZ uses for it)
# ─────────────────────────────────────────────────────────────
# The settings window's Controls tab changes these lines (two keys per action;
# this file's comments stay). By hand: a comma-separated list of keys. A key
# with modifiers (Shift+X, Ctrl+X, Alt+X) needs them held; a key without works
# whatever is held. Shift / Control / Alt are either side; LShift, RShift,
# LControl, RControl, LAlt, RAlt, NumpadEnter one side. Any other key without
# a name here: Scancode<N> (SDL's number). Mouse: LMB, RMB, MMB, Mouse4 (back),
# Mouse5 (forward), Mouse6-Mouse32 (further buttons, if the mouse's driver
# reports them through Raw Input), WheelUp, WheelDown, WheelLeft, WheelRight.
#
# Menus (whenever the game isn't in on-foot play): arrows / WASD move, Enter or
# left click = A (select), Esc or right click = B (back), P = Start (multiplayer
# setup needs it), the wheel = up / down. Button prompts stay Xbox.

keybind_right_trigger = "LMB"          # RT: fire
keybind_left_trigger = "RMB"           # LT: aim / zoom
keybind_x = "R"                        # X: reload
keybind_a = "Space,E"                  # A: use, doors, take cover (PDZ has no jump)
keybind_lstick_press = "Control,C"     # L3: crouch / stand
keybind_y = "Q,WheelUp,WheelDown"      # Y: select a weapon
keybind_right_shoulder = "F,MMB"       # RB: secondary fire mode
keybind_b = "V,Mouse4"                 # B: melee attack
keybind_left_shoulder = "Shift,Mouse5" # LB: dodge (with a movement key for the direction)
keybind_rstick_press = "Z"             # R3
keybind_start = "Escape,P"             # Start: pause; P is Start in menus too (Esc is B there)
keybind_back = "Tab"                   # Back: objectives / scores

# Left stick: move
keybind_lstick_up = "W"
keybind_lstick_down = "S"
keybind_lstick_left = "A"
keybind_lstick_right = "D"

# D-pad: gadgets and items (left = the datathief in the training); menus too
keybind_dpad_up = "1,Up"
keybind_dpad_right = "2,Right"
keybind_dpad_down = "3,Down"
keybind_dpad_left = "4,Left"

# Right stick without a mouse (keyboard-only look)
keybind_rstick_up = "Numpad8"
keybind_rstick_down = "Numpad2"
keybind_rstick_left = "Numpad4"
keybind_rstick_right = "Numpad6"

keybind_guide = ""                     # Guide button (empty = disabled)

# Mod hotkeys
bind_third_person = "F8"               # Toggle third-person camera (pdz_tp_*; not in the TU3 build)
