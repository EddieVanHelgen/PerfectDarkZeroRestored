# U12 / U18 (src/mod/dlc_maps.cpp): while the title update package registers
# (sub_821F0410), a record it shouldn't take counts as already registered (r3
# = the name's existing record, tested at 821F04D4).
[[midasm_hook]]
address = 0x821F04D4
name = "PdzTuPackageEntry"
registers = ["r3", "r31"]

