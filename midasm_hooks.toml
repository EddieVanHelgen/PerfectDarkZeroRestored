# Mid-function hooks for the recompiler (included from
# perfectdarkzerorecomp_manifest.toml). Each entry calls a C++ function from
# src/mod just before the instruction at `address`; with jump_address_on_true
# the recompiled code jumps to that address (inside the same function) when
# the function returns true. Changing this file re-runs codegen on the next
# build; only the files holding the hooked functions are rewritten.
#
# Rare's Title Update 3 fixes (src/mod/tu_fixes.cpp, pdz_fix_tu_*). The jump
# targets are the launch addresses of TU3's new branch targets.

# U7: Datacore script null check on +2592 (TU3 822FFDC8).
[[midasm_hook]]
address = 0x822F89A0
name = "PdzTuDatacoreNull"
registers = ["r31"]
jump_address_on_true = 0x822F8CDC

[[midasm_hook]]
address = 0x822F8D64
name = "PdzTuDatacoreNull"
registers = ["r31"]
jump_address_on_true = 0x822F8F98

